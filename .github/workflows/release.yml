name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  linux:
    name: Linux release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install desktop UI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxrandr-dev

      - name: Test release inputs
        run: |
          cargo test --workspace --locked
          cargo run --locked -p md-cli -- validate-suite

      - name: Build release binaries
        run: |
          cargo build --locked --release -p md-cli --bin md
          cargo build --locked --release -p md-ui --features desktop --bin md-ui

      - name: Package artifacts
        run: |
          set -euo pipefail
          host="$(rustc -Vv | awk '/host:/ { print $2 }')"
          package="md-workstation-${RELEASE_TAG}-${host}"
          mkdir -p "dist/${package}/bin"
          cp target/release/md "dist/${package}/bin/"
          cp target/release/md-ui "dist/${package}/bin/"
          cp README.md Cargo.toml Cargo.lock "dist/${package}/"
          cp -R examples "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          sha256sum "dist/${package}.tar.gz" > "dist/${package}.tar.gz.sha256"
          ls -lh dist/*.tar.gz dist/*.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" \
            dist/*.tar.gz \
            dist/*.sha256 \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes
