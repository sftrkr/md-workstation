[project]
name = "Binary checkpoint validation"
description = "Small deterministic run used to validate compact binary checkpoint output and resume metadata."

[simulation]
steps = 20
dt = 0.001
output_interval = 5
temperature = 0.2

[system]
particles = 8
mass = 1.0
element = "Ar"
seed = 123
lattice_spacing = 1.4

[box]
x = 6.0
y = 6.0
z = 6.0
periodic = false

[force]
type = "lennard-jones"
epsilon = 1.0
sigma = 1.0
cutoff = 2.5
shift_potential = false

[checkpoint]
format = "binary"

[output]
directory = "runs"
name = "validation-binary-checkpoint"
