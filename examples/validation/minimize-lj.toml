[project]
name = "LJ minimization validation"
description = "Small close-contact argon dimer used to validate steepest-descent energy minimization outputs."

[simulation]
steps = 1
dt = 0.001
output_interval = 1
temperature = 0.0

[input]
path = "../molecules/argon-minimize.xyz"
format = "xyz"
frame = 0

[system]
mass = 1.0
seed = 123

[box]
x = 6.0
y = 6.0
z = 6.0
periodic = false

[force]
type = "lennard-jones"
epsilon = 1.0
sigma = 1.0
cutoff = 2.5
shift_potential = false

[minimization]
steps = 80
output_interval = 10
step_size = 0.001
max_displacement = 0.02
force_tolerance = 0.000001
max_backtracks = 12

[output]
directory = "runs"
name = "validation-minimize-lj"
