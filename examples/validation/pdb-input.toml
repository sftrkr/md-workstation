[project]
name = "PDB input validation"
description = "Small PDB subset input used to validate coordinate parsing and atom metadata preservation."

[simulation]
steps = 10
dt = 0.001
output_interval = 5
temperature = 0.0

[input]
path = "../molecules/alanine-fragment.pdb"
format = "pdb"
frame = 0

[system]
mass = 1.0
seed = 123

[box]
x = 7.0
y = 7.0
z = 7.0
periodic = false

[force]
type = "lennard-jones"
epsilon = 0.1
sigma = 1.0
cutoff = 2.5
shift_potential = false

[output]
directory = "runs"
name = "validation-pdb-input"
