[project]
name = "Berendsen thermostat validation"
description = "Small deterministic run used to validate basic NVT temperature coupling metadata and behavior."

[simulation]
steps = 60
dt = 0.001
output_interval = 10
temperature = 0.4

[system]
particles = 27
mass = 1.0
element = "Ar"
seed = 949
lattice_spacing = 1.35

[box]
x = 7.0
y = 7.0
z = 7.0
periodic = false

[force]
type = "lennard-jones"
epsilon = 1.0
sigma = 1.0
cutoff = 2.5
shift_potential = false

[thermostat]
type = "berendsen"
target_temperature = 0.2
tau = 0.02

[neighbor]
enabled = true
skin = 0.3
rebuild_interval = 10

[execution]
parallel = true

[output]
directory = "runs"
name = "validation-berendsen-thermostat"
