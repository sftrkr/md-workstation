[project]
name = "Long NVE drift validation"
description = "100k-step deterministic NVE run used to bound long-run energy drift."

[simulation]
steps = 100000
dt = 0.00025
output_interval = 1000
temperature = 0.2

[system]
particles = 512
mass = 1.0
element = "Ar"
seed = 123
lattice_spacing = 1.4

[box]
x = 12.0
y = 12.0
z = 12.0
periodic = true

[force]
type = "lennard-jones"
epsilon = 1.0
sigma = 1.0
cutoff = 2.5
shift_potential = true

[neighbor]
enabled = true
skin = 0.3
rebuild_interval = 10

[execution]
parallel = true

[output]
directory = "runs"
name = "validation-long-nve-drift"
