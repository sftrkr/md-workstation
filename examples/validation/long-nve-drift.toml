[project]
name = "Long NVE drift validation"
description = "10k-step deterministic NVE run used to bound long-run energy drift."

[simulation]
steps = 10000
dt = 0.0001
output_interval = 1000
temperature = 0.2

[system]
particles = 8
mass = 1.0
element = "Ar"
seed = 123
lattice_spacing = 1.4

[box]
x = 6.0
y = 6.0
z = 6.0
periodic = false

[force]
type = "lennard-jones"
epsilon = 1.0
sigma = 1.0
cutoff = 2.5
shift_potential = true

[output]
directory = "runs"
name = "validation-long-nve-drift"
