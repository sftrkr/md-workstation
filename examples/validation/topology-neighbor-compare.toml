[project]
name = "Topology-aware neighbor benchmark"
description = "Small topology-backed benchmark config with harmonic bonds, an angle, Coulomb, and bonded exclusions."

[simulation]
steps = 20
dt = 0.001
output_interval = 10
temperature = 0.01

[input]
path = "../molecules/argon-angle.xyz"
format = "xyz"
frame = 0

[topology]
path = "../topology/argon-angle.toml"

[system]
mass = 1.0
seed = 919

[box]
x = 6.0
y = 6.0
z = 6.0
periodic = false

[force]
type = "lennard-jones"
epsilon = 0.02
sigma = 1.0
cutoff = 2.5
shift_potential = false

[coulomb]
enabled = true
constant = 0.1
cutoff = 3.0
shift_potential = false

[neighbor]
enabled = true
skin = 0.3
rebuild_interval = 10

[execution]
parallel = true

[output]
directory = "runs"
name = "validation-topology-neighbor-compare"
