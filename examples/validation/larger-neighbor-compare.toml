[project]
name = "Larger neighbor benchmark"
description = "512-particle periodic LJ workload for comparing naive, neighbor, and parallel force paths."

[simulation]
steps = 20
dt = 0.001
output_interval = 10
temperature = 0.2

[system]
particles = 512
mass = 1.0
element = "Ar"
seed = 4242
lattice_spacing = 1.35

[box]
x = 14.0
y = 14.0
z = 14.0
periodic = true

[force]
type = "lennard-jones"
epsilon = 1.0
sigma = 1.0
cutoff = 2.5
shift_potential = true

[neighbor]
enabled = true
skin = 0.3
rebuild_interval = 5

[execution]
parallel = true

[output]
directory = "runs"
name = "validation-larger-neighbor-compare"
