[project]
name = "Periodic dihedral chain validation"
description = "Small four-atom chain used to validate periodic dihedral topology, forces, and report metadata."

[simulation]
steps = 30
dt = 0.001
output_interval = 10
temperature = 0.01

[input]
path = "../molecules/argon-dihedral.xyz"
format = "xyz"
frame = 0

[topology]
path = "../topology/argon-dihedral.toml"

[system]
mass = 1.0
seed = 939

[box]
x = 6.0
y = 6.0
z = 6.0
periodic = false

[force]
type = "lennard-jones"
epsilon = 0.02
sigma = 1.0
cutoff = 2.5
shift_potential = false

[coulomb]
enabled = false
constant = 0.1
cutoff = 3.0
shift_potential = false

[neighbor]
enabled = false
skin = 0.3
rebuild_interval = 10

[execution]
parallel = true

[output]
directory = "runs"
name = "validation-dihedral-chain"
